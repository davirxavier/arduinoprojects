[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

[env:attiny13]
platform = atmelavr
board = attiny13
framework = arduino
board_build.mcu = attiny13
board_build.f_cpu = 9600000L
upload_speed = 115200
upload_protocol = stk500v1
upload_flags =
    -P$UPLOAD_PORT
upload_port = COM3