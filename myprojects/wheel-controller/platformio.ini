; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
build_flags = -Wl,-u,vfprintf -lprintf_flt -lm

[env:attiny13]
platform = atmelavr
board = attiny13
framework = arduino
# MicroCore specific hardware overrides
board_build.f_cpu = 4800000L       # Options: 1200000L, 4800000L, 8000000L, 9600000L, etc.
board_hardware.oscillator = internal # Can be internal or external
board_hardware.bod = 1.8v          # Options: 4.3v, 2.7v, 1.8v, or disabled
board_hardware.eesave = no        # Preserve EEPROM during chip erase (yes/no)
board_fuses.hfuse = 0xFC
#
upload_protocol = stk500v1
upload_speed = 115200
;upload_port = /dev/ttyUSB0
build_flags =
    -Os
    -flto
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED